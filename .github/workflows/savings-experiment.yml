# Measured-savings experiment for the Rofunc install bottleneck.
# The traces showed two separate dependency resolutions under a downgraded
# pip 21.0 (requirements.txt, then `pip install .`).
# Fixed: install everything in one resolution with current pip.
# Functionality checks: environment fingerprint and the workflow's own tests.
# One run each, same pinned source, no instrumentation.

name: savings-experiment

on:
  workflow_dispatch:
  push:
    branches:
      - savings-experiment

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, fixed]
        python-version: [ "3.8" ]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Free up disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.variant }}" = "fixed" ]; then
            python -m pip install flake8 pytest pytest-cov -r requirements.txt .
          else
            python -m pip install flake8 pytest pytest-cov
            pip install pip==21.0
            pip install -r requirements.txt
            pip install .
          fi
          sudo apt install -qqy lsb-release gnupg2 curl
          sudo apt-get update
      - name: Environment fingerprint
        run: |
          echo "packages: $(pip freeze | wc -l)"
          echo "fingerprint: $(pip freeze | grep -viE '^(pip|rofunc)[= @]' | sort | sha256sum)"
          pip freeze | grep -iE '^(numpy|torch|gym|gymnasium|transformers|setuptools)=='
      - name: Test with pytest
        run: |
          cd tests
          pytest test_*.py --doctest-modules --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html
